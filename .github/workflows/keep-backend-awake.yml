name: Backend health check

# Hits /health/ready, which also checks the database and answers 503 if it's
# unreachable, so this job goes red when the store can't serve catalog/admin
# routes. Vercel doesn't sleep the backend, so this is a monitor, not a
# keep-warm ping: hourly is enough, and pinging more often would keep Neon's
# compute awake around the clock and burn the free plan's compute hours.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend readiness endpoint
        run: curl -fsS --max-time 30 https://camp-merch-backend.vercel.app/health/ready
